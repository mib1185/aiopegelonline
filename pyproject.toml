[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aiopegelonline"
version = "0.1.2"
description = "Asynchronous library to retrieve data from PEGELONLINE."
authors = [{ name = "mib1185" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = '>=3.10'
dependencies = ["aiohttp"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[dependency-groups]
dev = [
    "aiointercept==0.1.12",
    "black==26.10.1",
    "mypy==2.4.1",
    "pre-commit-hooks==6.0.0",
    "prek==0.5.9",
    "pylint==4.1.3",
    "pytest-asyncio==1.4.1",
    "pytest-cov==7.1.0",
    "pytest==9.2.0",
    "reorder-python-imports==3.17.0",
]

[project.urls]
homepage = 'https://github.com/mib1185/aiopegelonline'
repository = 'https://github.com/mib1185/aiopegelonline'

[tool.setuptools]
package-data = { "aiopegelonline" = ["py.typed"] }
platforms = ["any"]

[tool.setuptools.packages.find]
include = ["aiopegelonline*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88
